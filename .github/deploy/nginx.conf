# --- 1. THE API (api.flaggedit.app) ---
server {
    server_name api.flaggedit.app;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.flaggedit.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.flaggedit.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # 1. ALLOW Certbot validation (most specific, high priority)
    # This is crucial for SSL certificate renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html; # Certbot standard root
        allow all;          # Ensure it's not accidentally blocked
    }

    # 2. BLOCK ALL FILE-LIKE REQUESTS (unless caught by #1)
    # For an API-only server, any request with a file extension is suspicious
    # and should be rejected immediately to save backend resources.
    location ~ \.[a-zA-Z0-9]+$ {
        return 444; # NGINX specific: "No Response" - immediately close connection
    }

    # 3. PROXY ALL REMAINING TRAFFIC TO GO API
    # At this point, any request without a file extension is assumed to be an API endpoint.
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 4. HTTP to HTTPS REDIRECT ---
server {
    listen 80;
    server_name api.flaggedit.app;

    # For Let's Encrypt certificate validation (needed for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
