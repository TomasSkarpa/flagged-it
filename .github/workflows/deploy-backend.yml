name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/web/**'
      - 'internal/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
      - '.github/deploy/flagged-it.service'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Build Go binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o flagged-it-server ./cmd/web
          chmod +x flagged-it-server

      - name: Deploy on server
        run: |
          set -e
          
          # Create deployment directories
          sudo mkdir -p /opt/flagged-it/bin
          sudo mkdir -p /opt/flagged-it/assets
          sudo mkdir -p /opt/flagged-it/logs
          
          # Stop service before updating binary (to avoid "Text file busy" error)
          sudo systemctl stop flagged-it.service || true
          
          # Copy binary and assets
          sudo cp flagged-it-server /opt/flagged-it/bin/flagged-it-server
          sudo chmod +x /opt/flagged-it/bin/flagged-it-server
          
          sudo cp -r assets /opt/flagged-it/
          sudo chown -R $USER:$USER /opt/flagged-it/assets
          
          # Update systemd service file if it exists in the repo
          if [ -f .github/deploy/flagged-it.service ]; then
            sudo cp .github/deploy/flagged-it.service /etc/systemd/system/flagged-it.service
            sudo systemctl daemon-reload
          fi

            # Update NGINX configuration
          if [ -f .github/deploy/nginx.conf ]; then
            # Clean up old security traps directory if it exists
            sudo rm -rf /opt/flagged-it/deploy/nginx
            
            # Copy main site config
            sudo cp .github/deploy/nginx.conf /etc/nginx/sites-available/flagged-it.conf
            
            # Enable the site if it's not already enabled
            sudo ln -sf /etc/nginx/sites-available/flagged-it.conf /etc/nginx/sites-enabled/flagged-it.conf
            
            # Remove default or old-style extensionless config to avoid conflicts
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo rm -f /etc/nginx/sites-enabled/flagged-it
            
            # Test and reload NGINX
            sudo nginx -t && sudo systemctl reload nginx
          fi

          # Update Fail2Ban configuration if installed
          if [ -d /etc/fail2ban ]; then
            # Remove old filter file if it exists
            sudo rm -f /etc/fail2ban/filter.d/nginx-strict-bots.conf
            
            # Copy new jail config (which now includes the filter regex inline)
            if [ -f .github/deploy/fail2ban-jail.conf ]; then
              sudo cp .github/deploy/fail2ban-jail.conf /etc/fail2ban/jail.d/flagged-it.conf
            fi
            sudo systemctl restart fail2ban || true
          fi
          
          # Start service
          sudo systemctl start flagged-it.service
          sleep 2
          sudo systemctl status flagged-it.service --no-pager -l || true

      - name: Verify deployment
        run: |
          sleep 3
          curl -f http://localhost:8080/api/health || exit 1
          echo "✓ Backend is running and healthy"
