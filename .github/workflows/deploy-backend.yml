name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/web/**'
      - 'internal/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
      - '.github/deploy/flagged-it.service'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Build Go binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o flagged-it-server ./cmd/web
          chmod +x flagged-it-server

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_HOST }} >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
            set -e
            mkdir -p /opt/flagged-it/bin
            mkdir -p /opt/flagged-it/assets
            mkdir -p /opt/flagged-it/logs
          EOF
          
          scp -o StrictHostKeyChecking=accept-new flagged-it-server ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/opt/flagged-it/bin/flagged-it-server
          
          scp -r -o StrictHostKeyChecking=accept-new assets ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }}:/opt/flagged-it/
          
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
            sudo systemctl restart flagged-it.service
            sleep 2
            sudo systemctl status flagged-it.service --no-pager -l || true
          EOF

      - name: Verify deployment
        run: |
          sleep 3
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_SERVER_USER }}@${{ secrets.DEPLOY_SERVER_HOST }} << 'EOF'
            curl -f http://localhost:8080/api/health || exit 1
            echo "✓ Backend is running and healthy"
          EOF
