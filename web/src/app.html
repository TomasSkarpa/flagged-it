<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Set lang attribute IMMEDIATELY based on user's browser language preference
			// This runs synchronously before any content renders - critical for SEO
			// Language is based on user's browser preference, not geographic location
			(function() {
				try {
					// Get user's preferred language from localStorage (if previously saved) or browser
					const storedLocale = localStorage.getItem('locale');
					const browserLocale = (navigator.language || navigator.userLanguage || 'en').split('-')[0];
					const locale = storedLocale || browserLocale || 'en';
					
					// Set html lang attribute immediately for SEO crawlers
					// This matches the actual content language based on user preference
					const htmlElement = document.documentElement || document.getElementsByTagName('html')[0];
					if (htmlElement) {
						htmlElement.setAttribute('lang', locale);
						
						// Set text direction for RTL languages
						const rtlLanguages = ['ar', 'he'];
						if (rtlLanguages.includes(locale)) {
							htmlElement.setAttribute('dir', 'rtl');
						} else {
							htmlElement.setAttribute('dir', 'ltr');
						}
					}
				} catch (e) {
					// Fallback: keep default lang="en" if script fails
				}
			})();
		</script>
		<title>Flagged It - Learn Countries Through Fun Guessing Games</title>
		<link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
		<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/assets/favicon/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0A0E27" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Flagged It" />
		<meta http-equiv="content-language" id="meta-content-language" content="en" />
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" id="og-title" content="Flagged It - Learn Countries Through Fun Guessing Games" />
		<meta property="og:description" id="og-description" content="Learn about countries playing different game modes - guessing games, flag recognition, and shape identification." />
		<meta property="og:image" id="og-image" content="https://flaggedit.app/assets/favicon/apple-touch-icon.png" />
		<meta property="og:url" id="og-url" content="https://flaggedit.app/" />
		<meta property="og:site_name" content="Flagged It" />
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" id="twitter-title" content="Flagged It - Learn Countries Through Fun Guessing Games" />
		<meta name="twitter:description" id="twitter-description" content="Learn about countries playing different game modes - guessing games, flag recognition, and shape identification." />
		<meta name="twitter:image" id="twitter-image" content="https://flaggedit.app/assets/favicon/apple-touch-icon.png" />
		<script>
			// content-language + og:url; route-specific title/description are injected below by SvelteKit
			(function () {
				const locale =
					localStorage.getItem('locale') ||
					(navigator.language || navigator.userLanguage || 'en').split('-')[0];
				const contentLangMeta = document.getElementById('meta-content-language');
				if (contentLangMeta) {
					contentLangMeta.setAttribute('content', locale);
				}
				const ogUrl = document.getElementById('og-url');
				if (ogUrl) {
					ogUrl.setAttribute('content', 'https://flaggedit.app' + window.location.pathname);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
