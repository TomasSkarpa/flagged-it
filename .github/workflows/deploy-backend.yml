name: Deploy Backend to Server

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/web/**'
      - 'internal/**'
      - 'assets/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy-backend.yml'
      - '.github/deploy/flagged-it.service'
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Build Go binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o flagged-it-server ./cmd/web
          chmod +x flagged-it-server

      - name: Deploy on server
        run: |
          set -e
          
          # Create deployment directories
          sudo mkdir -p /opt/flagged-it/bin
          sudo mkdir -p /opt/flagged-it/assets
          sudo mkdir -p /opt/flagged-it/logs
          
          # Copy binary and assets
          sudo cp flagged-it-server /opt/flagged-it/bin/flagged-it-server
          sudo chmod +x /opt/flagged-it/bin/flagged-it-server
          
          sudo cp -r assets /opt/flagged-it/
          sudo chown -R $USER:$USER /opt/flagged-it/assets
          
          # Update systemd service file if it exists in the repo
          if [ -f .github/deploy/flagged-it.service ]; then
            sudo cp .github/deploy/flagged-it.service /etc/systemd/system/flagged-it.service
            sudo systemctl daemon-reload
          fi
          
          # Restart service
          sudo systemctl restart flagged-it.service
          sleep 2
          sudo systemctl status flagged-it.service --no-pager -l || true

      - name: Verify deployment
        run: |
          sleep 3
          curl -f http://localhost:8080/api/health || exit 1
          echo "✓ Backend is running and healthy"
